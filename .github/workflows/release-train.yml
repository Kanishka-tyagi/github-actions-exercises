name : Release Train
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

defaults:
  run:
    working-directory: app

env:
  SERVICE_NAME: app

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '20.x'
            - run: npm ci
            - run: npm test
            - run: node --version
            - run: npm --version
            - run: which node
            
    package:
        runs-on: ubuntu-latest
        needs: verify
        outputs:
          release_ref: ${{ steps.release_ref.outputs.release_ref }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '20.x'
            - name: Create release reference
              id: release_ref
              run: |
                SHA_SHORT="${GITHUB_SHA::7}"
                RELEASE_REF=${SERVICE_NAME}-${GITHUB_RUN_NUMBER}-${SHA_SHORT}
                echo "RELEASE_REF=$RELEASE_REF" >> "$GITHUB_ENV"
                echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

            - name: Create release folder
              run: mkdir release
            
            - name: Create release file
              run: |
                cat > "release/${RELEASE_REF}" <<EOF
                deployment_target: ${{vars.DEPLOYMENT_TARGET}}
                ref: ${{github.ref}}
                event: ${{github.event_name}}
                triggered_by: ${{github.actor}}
                build_time_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
                EOF

            - name: Copy app file
              run: cp package.json release/

            - name: Install jq and tree
              run: |
               sudo apt-get update
               sudo apt-get install -y jq tree
            
            
            - name: Create manifest
              run: |
               BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

               jq -n \
                --arg deployment_target "${{vars.DEPLOYMENT_TARGET}}" \
                --arg ref "${{github.ref}}" \
                --arg event "${{github.event_name}}" \
                --arg triggered_by "${{github.actor}}" \
                --arg build_time "$BUILD_TIME" \
                '{
                deployment_target: $deployment_target,
                ref: $ref,
                event: $event,
                triggered_by: $triggered_by,
                build_time_utc: $build_time
                }' > release/manifest.json

            - name: Prove manifest parses
              run: jq '.deployment_target' release/manifest.json
            
            - name: Show release structure
              run: tree -L 2 release
    
    announce:
        runs-on: ubuntu-latest
        needs: package
        steps:

            - name: Print release reference
              run: |
                echo "Release reference: ${{ needs.package.outputs.release_ref }}"
                echo "Deployment target: ${{ vars.DEPLOYMENT_TARGET }}"
                echo "Service name: $SERVICE_NAME"
              

            - name: Announce release type
              run: |
                if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo "candidate"
                elif [ "${{ github.event_name }}" = "push" ]; then
                    echo "release"
                fi
            - name: Complete release train
              run: echo "Release train complete"


