name: The Python Inspector
on:
    #push:
    workflow_dispatch:
jobs:
    inspect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.11'
            - run: python --version
            - run: pip --version
            - run: which python
            - run: echo "Inspection complete"